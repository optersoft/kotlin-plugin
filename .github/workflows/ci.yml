name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: ~/.cache/JetBrains/Kotlin
          key: kotlin-toolchain-${{ runner.os }}-${{ hashFiles('kotlin', '**/module.yaml', '**/plugin.yaml') }}
          restore-keys: kotlin-toolchain-${{ runner.os }}-
      - name: Build
        run: ./kotlin build
      - name: Check (tests + migrations)
        run: ./kotlin check
